name: Make blog post pages

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: make-post-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Make pages for new posts from Supabase
        run: node make_post_pages.js

      - name: Save new pages if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-post-*.html
          if git diff --cached --quiet; then
            echo "No new pages."
          else
            git commit -m "Add post pages (auto)"
            git push
          fi
