<style>
  :root{
    color-scheme: dark;
    --navy:#101a2e;
    --navy-2:#1c2b4a;
    --blue:#2f5fff;
    --blue-soft:#e7ecff;
    --cream:#f7f5f0;
    --paper:#fffdf9;
    --coral:#ff6b4a;
    --line: rgba(16,26,46,0.12);
    --text-dim: rgba(16,26,46,0.62);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter', sans-serif;
    background:var(--cream);
    color:var(--navy);
    overflow-x:hidden;
  }
  a{color:inherit; text-decoration:none;}
  ::selection{background:var(--blue); color:#fff;}

  .wrap{max-width:1180px; margin:0 auto; padding:0 32px;}

  /* NAV */
  header{
    position:sticky; top:0; z-index:50;
    background:rgba(247,245,240,0.86);
    backdrop-filter: blur(10px);
    border-bottom:1px solid var(--line);
  }
  nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 0;
  }
  .logo{
    font-family:'Fraunces', serif;
    font-weight:700; font-size:23px;
    letter-spacing:-0.5px;
  }
  .logo .dot{color:var(--blue);}
  .nav-links{
    display:flex; gap:40px; align-items:center;
    font-size:14px; font-weight:600; letter-spacing:0.02em;
  }
  .nav-links a{position:relative; padding:4px 0; color:var(--navy);}
  .nav-links a::after{
    content:""; position:absolute; left:0; bottom:0; width:0; height:2px;
    background:var(--blue); transition:width .25s ease;
  }
  .nav-links a:hover::after{width:100%;}
  .qq-bangla-btn{background:rgba(0,245,107,.12); border:1px solid rgba(0,245,107,.4); border-radius:999px; padding:7px 16px!important; color:#00f56b!important;}
  .qq-bangla-btn::after{display:none!important;}
  .qq-bangla-btn:hover{background:rgba(0,245,107,.22); border-color:#00f56b;}
  .nav-cta{
    background:var(--navy); color:var(--paper);
    padding:11px 22px; border-radius:100px;
    font-size:13.5px; font-weight:600;
    display:inline-flex; align-items:center; gap:8px;
    transition:background .2s ease, transform .2s ease;
  }
  .nav-cta:hover{background:var(--blue); transform:translateY(-1px);}
  .burger{display:none; flex-direction:column; gap:5px; cursor:pointer; background:none; border:none;}
  .burger span{width:24px; height:2px; background:var(--navy); display:block;}

  /* HERO */
  .hero{
    position:relative;
    padding:96px 0 60px;
    overflow:hidden;
  }
  .eyebrow{
    display:inline-flex; align-items:center; gap:10px;
    font-family:'Space Mono', monospace;
    font-size:12px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--blue); background:var(--blue-soft);
    padding:8px 16px; border-radius:100px;
    margin-bottom:28px;
  }
  .eyebrow::before{content:"●"; font-size:8px;}
  .hero-grid{
    display:grid; grid-template-columns:1.1fr 0.9fr; gap:40px; align-items:center;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(38px, 5vw, 62px);
    line-height:1.06;
    letter-spacing:-1.5px;
    color:var(--navy);
  }
  h1 em{
    font-style:italic; font-weight:500; color:var(--blue);
    display:block;
  }
  .hero p.lede{
    margin-top:26px; font-size:17px; line-height:1.7; color:var(--text-dim);
    max-width:460px;
  }
  .hero-actions{
    display:flex; align-items:center; gap:22px; margin-top:38px;
  }
  .btn-primary{
    background:var(--blue); color:#fff;
    padding:16px 30px; border-radius:100px;
    font-weight:600; font-size:15px;
    display:inline-flex; align-items:center; gap:10px;
    box-shadow:0 14px 30px -12px rgba(47,95,255,0.55);
    transition:transform .2s ease, box-shadow .2s ease;
    border:none; cursor:pointer;
  }
  .btn-primary:hover{transform:translateY(-2px); box-shadow:0 18px 34px -10px rgba(47,95,255,0.6);}
  .btn-ghost{
    display:inline-flex; align-items:center; gap:10px;
    font-weight:600; font-size:15px; color:var(--navy);
  }
  .play-circle{
    width:44px; height:44px; border-radius:50%;
    border:1.5px solid var(--navy);
    display:flex; align-items:center; justify-content:center;
    transition:background .2s ease, color .2s ease;
  }
  .btn-ghost:hover .play-circle{background:var(--navy); color:#fff;}

  .stat-row{
    display:flex; gap:36px; margin-top:56px; padding-top:32px;
    border-top:1px solid var(--line);
  }
  .stat b{
    font-family:'Fraunces', serif; font-size:28px; font-weight:600; display:block;
  }
  .stat span{font-size:12.5px; color:var(--text-dim); letter-spacing:0.02em;}

  /* HERO VISUAL - signature element: an "growth dial" illustration */
  .hero-visual{
    position:relative; height:480px;
    display:flex; align-items:center; justify-content:center;
  }
  .dial-card{
    position:relative; width:340px; height:400px;
    background:var(--navy);
    border-radius:28px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow:0 40px 60px -20px rgba(16,26,46,0.4);
  }
  .dial{
    width:220px; height:220px; position:relative;
  }
  .dial svg{width:100%; height:100%; transform:rotate(-90deg);}
  .dial-bg{fill:none; stroke:rgba(255,255,255,0.1); stroke-width:10;}
  .dial-fg{
    fill:none; stroke:var(--blue); stroke-width:10; stroke-linecap:round;
    stroke-dasharray:552; stroke-dashoffset:552;
    animation:dialfill 1.8s cubic-bezier(.3,1,.4,1) 0.4s forwards;
  }
  @keyframes dialfill{ to{ stroke-dashoffset:114; } }
  .dial-label{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    text-align:center; color:#fff;
  }
  .dial-label b{font-family:'Fraunces', serif; font-size:40px; display:block;}
  .dial-label span{font-size:11px; letter-spacing:0.1em; color:rgba(255,255,255,0.6); text-transform:uppercase;}
  .dial-caption{
    margin-top:22px; color:rgba(255,255,255,0.75); font-size:13px; text-align:center; max-width:220px; line-height:1.5;
  }
  .float-chip{
    position:absolute; background:var(--paper); border-radius:16px;
    padding:12px 16px; box-shadow:0 16px 30px -12px rgba(16,26,46,0.25);
    display:flex; align-items:center; gap:10px; font-size:13px; font-weight:600;
  }
  .float-chip.c1{ top:14px; left:-30px; animation: floaty 5s ease-in-out infinite; }
  .float-chip.c2{ bottom:36px; right:-24px; animation: floaty 6s ease-in-out infinite 1s; }
  @keyframes floaty{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }
  .chip-dot{width:8px; height:8px; border-radius:50%; background:var(--blue);}
  .chip-dot.coral{background:var(--coral);}

  /* SECTION HEADER */
  .section{padding:110px 0;}
  .section-head{
    max-width:600px; margin-bottom:64px;
  }
  .tag{
    font-family:'Space Mono', monospace; font-size:12px; letter-spacing:0.12em;
    text-transform:uppercase; color:var(--blue); margin-bottom:16px; display:block;
  }
  h2{
    font-family:'Fraunces', serif; font-weight:600;
    font-size:clamp(30px, 3.6vw, 44px);
    letter-spacing:-1px; line-height:1.12;
  }
  .section-head p{margin-top:18px; color:var(--text-dim); font-size:16px; line-height:1.7;}

  /* ABOUT */
  #about .section{background:var(--paper);}
  .about-grid{
    display:grid; grid-template-columns:0.9fr 1.1fr; gap:64px; align-items:center;
  }
  .about-frame{
    position:relative; height:480px; border-radius:24px;
    background:linear-gradient(155deg, var(--navy-2), var(--navy));
    overflow:hidden;
    box-shadow:0 40px 70px -24px rgba(16,26,46,0.45);
  }
  .about-frame::before{
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(circle at 20% 20%, rgba(47,95,255,0.35), transparent 45%),
      radial-gradient(circle at 80% 75%, rgba(255,107,74,0.25), transparent 40%);
    z-index:1; pointer-events:none;
    mix-blend-mode:multiply;
    opacity:0.5;
  }
  .about-photo-frame{ padding:0; }
  .about-photo{
    width:100%; height:100%; object-fit:cover; object-position:center 18%;
    display:block; filter:saturate(1.08) contrast(1.05);
  }
  .about-photo-frame::after{
    content:""; position:absolute; inset:0; z-index:1; pointer-events:none;
    background:linear-gradient(to top, rgba(16,26,46,0.85) 0%, rgba(16,26,46,0.15) 34%, transparent 55%);
  }
  .about-nameplate{
    position:absolute; left:28px; right:28px; bottom:26px; z-index:2;
    display:flex; align-items:center; gap:14px;
  }
  .about-nameplate .avatar-dot{
    width:10px; height:10px; border-radius:50%; background:var(--coral);
    flex-shrink:0; box-shadow:0 0 0 4px rgba(255,107,74,0.25);
  }
  .about-nameplate h4{
    font-family:'Fraunces', serif; font-weight:600; font-size:21px; color:#fff;
    letter-spacing:-0.3px; line-height:1.2;
  }
  .about-nameplate span{
    display:block; font-size:12.5px; color:rgba(255,255,255,0.7);
    letter-spacing:0.04em; margin-top:2px;
  }
  .bars{
    position:absolute; bottom:36px; left:36px; right:36px;
    display:flex; align-items:flex-end; gap:14px; height:180px;
  }
  .bars i{
    flex:1; background:rgba(255,255,255,0.15); border-radius:8px 8px 0 0;
    position:relative; overflow:hidden;
  }
  .bars i::after{
    content:""; position:absolute; bottom:0; left:0; right:0;
    background:var(--blue); height:0%;
    animation:rise 1.6s cubic-bezier(.3,1,.4,1) forwards;
    border-radius:8px 8px 0 0;
  }
  .bars i:nth-child(1)::after{height:38%; animation-delay:.1s;}
  .bars i:nth-child(2)::after{height:58%; animation-delay:.22s;}
  .bars i:nth-child(3)::after{height:44%; animation-delay:.34s;}
  .bars i:nth-child(4)::after{height:78%; animation-delay:.46s; background:var(--coral);}
  .bars i:nth-child(5)::after{height:66%; animation-delay:.58s;}
  .bars i:nth-child(6)::after{height:92%; animation-delay:.7s;}
  @keyframes rise{ from{height:0;} }

  .about-copy .feature{
    display:flex; gap:18px; padding:22px 0; border-top:1px solid var(--line);
  }
  .about-copy .feature:last-child{border-bottom:1px solid var(--line);}
  .feature-num{
    font-family:'Space Mono', monospace; font-size:13px; color:var(--blue); padding-top:3px;
  }
  .feature h3{font-family:'Fraunces', serif; font-size:19px; font-weight:600; margin-bottom:6px;}
  .feature p{font-size:14.5px; color:var(--text-dim); line-height:1.6;}

  /* SERVICES */
  #services .section{background:var(--cream);}
  .service-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:24px;
  }
  .service-grid-4{
    grid-template-columns:repeat(4, 1fr);
  }
  @media (max-width: 1000px){
    .service-grid-4{ grid-template-columns:repeat(2, 1fr); }
  }
  .service-card{
    background:var(--paper); border-radius:20px; padding:36px 30px;
    border:1px solid var(--line);
    transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .service-card:hover{
    transform:translateY(-6px);
    box-shadow:0 24px 40px -20px rgba(16,26,46,0.2);
    border-color:transparent;
  }
  .service-icon{
    width:52px; height:52px; border-radius:14px; background:var(--blue-soft);
    display:flex; align-items:center; justify-content:center; margin-bottom:24px;
    color:var(--blue);
  }
  .service-card.accent .service-icon{background:rgba(255,107,74,0.14); color:var(--coral);}
  .service-card h3{font-family:'Fraunces', serif; font-size:21px; font-weight:600; margin-bottom:10px;}
  .service-card p{font-size:14.5px; color:var(--text-dim); line-height:1.65;}
  .service-more{
    display:inline-flex; align-items:center; gap:6px; margin-top:20px;
    font-size:13.5px; font-weight:600; color:var(--navy);
  }

  /* CTA STRIP */
  .cta-strip{
    background:var(--navy); border-radius:28px; padding:64px 56px;
    display:flex; align-items:center; justify-content:space-between; gap:40px;
    flex-wrap:wrap;
    position:relative; overflow:hidden;
  }
  .cta-strip::before{
    content:""; position:absolute; width:340px; height:340px; border-radius:50%;
    background:radial-gradient(circle, rgba(47,95,255,0.35), transparent 70%);
    top:-140px; right:-80px;
  }
  .cta-strip h2{color:#fff; max-width:480px; position:relative;}
  .cta-strip .btn-primary{background:#fff; color:var(--navy); position:relative;}
  .cta-strip .btn-primary:hover{background:var(--blue-soft);}



  /* BLOGS */
  #blogs .section{background:var(--paper);}
  .blog-toolbar{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:34px;flex-wrap:wrap;}
  .blog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
  .blog-card{background:var(--cream);border:1px solid var(--line);border-radius:22px;overflow:hidden;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;display:flex;flex-direction:column;}
  .blog-card:hover{transform:translateY(-6px);box-shadow:0 24px 45px -22px rgba(16,26,46,.25);border-color:transparent;}
  .blog-media{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,var(--navy),var(--navy-2));overflow:hidden;}
  .blog-media img,.blog-media video,.blog-media iframe{width:100%;height:100%;object-fit:cover;display:block;border:0;}
  .blog-media .media-placeholder{height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Fraunces',serif;font-size:28px;padding:30px;text-align:center;}
  .blog-video-badge{position:absolute;top:14px;right:14px;background:rgba(16,26,46,.82);color:#fff;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:700;backdrop-filter:blur(8px);}
  .blog-date{font-family:'Space Mono',monospace;font-size:11px;color:var(--blue);letter-spacing:.08em;text-transform:uppercase;}
  .blog-body{padding:24px;display:flex;flex-direction:column;flex:1;}
  .blog-body h3{font-family:'Fraunces',serif;font-size:24px;line-height:1.15;margin:9px 0 10px;}
  .blog-excerpt{font-size:14px;color:var(--text-dim);line-height:1.7;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .blog-meta{display:flex;align-items:center;gap:14px;margin-top:auto;padding-top:20px;font-size:12px;color:var(--text-dim);}
  .blog-open{margin-left:auto;font-weight:700;color:var(--navy);}
  .blog-stats{display:flex;gap:12px;flex-wrap:wrap;}
  .blog-stat{display:inline-flex;align-items:center;gap:5px;}
  .blog-empty{grid-column:1/-1;padding:40px;text-align:center;border:1px dashed var(--line);border-radius:20px;color:var(--text-dim);}

  .blog-modal{position:fixed;inset:0;background:rgba(16,26,46,.68);backdrop-filter:blur(8px);z-index:100;display:none;padding:24px;overflow:auto;}
  .blog-modal.open{display:flex;align-items:center;justify-content:center;}
  .blog-dialog{width:min(900px,100%);max-height:92vh;overflow:auto;background:var(--paper);border-radius:26px;box-shadow:0 40px 100px rgba(0,0,0,.3);position:relative;}
  .blog-dialog-media{background:var(--navy);aspect-ratio:16/8;position:relative;overflow:hidden;}
  .blog-dialog-media img,.blog-dialog-media video,.blog-dialog-media iframe{width:100%;height:100%;object-fit:cover;display:block;border:0;}
  .blog-close{position:absolute;top:16px;right:16px;width:42px;height:42px;border:1px solid rgba(255,255,255,.3);background:rgba(16,26,46,.75);color:#fff;border-radius:50%;cursor:pointer;font-size:20px;z-index:2;}
  .blog-dialog-content{padding:34px;}
  .blog-dialog-content h2{margin:8px 0 12px;}
  .blog-full-body{white-space:pre-line;font-size:16px;line-height:1.9;color:var(--text-dim);margin-top:22px;}
  .blog-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px;padding-top:20px;border-top:1px solid var(--line);}
  .blog-action{border:1px solid var(--line);background:var(--cream);color:var(--navy);border-radius:999px;padding:10px 15px;display:inline-flex;align-items:center;gap:8px;font:600 13px 'Inter',sans-serif;cursor:pointer;transition:.2s ease;}
  .blog-action:hover,.blog-action.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .blog-action.like.active{background:#e94b68;border-color:#e94b68;}
  .blog-action.dislike.active{background:#6b7280;border-color:#6b7280;}
  .comment-box{margin-top:30px;padding-top:26px;border-top:1px solid var(--line);}
  .comment-box h3{font-family:'Fraunces',serif;font-size:23px;margin-bottom:16px;}
  .comment-form{display:grid;grid-template-columns:180px 1fr auto;gap:10px;}
  .comment-form input,.comment-form textarea{background:#fff;}
  .comment-form textarea{min-height:48px;resize:none;}
  .comment-list{display:flex;flex-direction:column;gap:12px;margin-top:18px;}
  .comment-item{padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--cream);}
  .comment-item b{font-size:13px;}.comment-item p{font-size:13px;line-height:1.6;color:var(--text-dim);margin-top:4px;}
  @media(max-width:900px){.blog-grid{grid-template-columns:1fr 1fr}.comment-form{grid-template-columns:1fr}}
  @media(max-width:600px){.blog-grid{grid-template-columns:1fr}.blog-dialog-content{padding:24px}.blog-modal{padding:10px}}

  /* CONTACT */
  #contact .section{background:var(--paper);}
  .contact-head{max-width:600px; margin:0 auto 52px; text-align:center;}
  .contact-head .tag{display:block;}
  .contact-head h2{margin-top:2px;}
  .contact-head p{margin-top:16px; color:var(--text-dim); font-size:16px; line-height:1.7;}
  .contact-card{
    max-width:1040px; margin:0 auto; border-radius:28px; border:1px solid var(--line);
    background:var(--paper); padding:56px; box-shadow:0 40px 80px -30px rgba(16,26,46,0.14);
  }
  .contact-grid{
    display:grid; grid-template-columns:0.85fr auto 1.15fr; gap:48px; align-items:center;
  }
  .contact-divider{width:1px; align-self:stretch; background:var(--line);}
  .contact-info .info-row{
    display:flex; gap:16px; padding:18px 0; border-top:1px solid var(--line);
  }
  .contact-info .info-row:last-of-type{border-bottom:1px solid var(--line);}
  .info-icon{
    width:38px; height:38px; border-radius:10px; background:var(--blue-soft); color:var(--blue);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    transition:transfo
